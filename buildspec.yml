project:
  description: Simple command line script accelerator
  author:
    name: Rob Lauer
    mailto: rclauer@gmail.com
pm-module: CLI::Simple
min-perl-version: 5.010
dependencies:
  test-requires: test-requires
  requires: requires
path:
  pm-module: lib
  tests: t
  exe-files: bin
  scripts: bin
extra-files:
  - ChangeLog
  - README.md
  - t/lib:
    - t/lib/CLISimpleHelpBoth.pm
    - t/lib/CLISimpleHelpSynopsis.pm
    - t/lib/CLISimpleHelpUsage.pm
man-links:
  - cli-simple: CLI::Simple::Shell
resources:
  homepage: http://github.com/rlauer6/CLI-Simple
  bugtracker:
    web: http://github.com/rlauer6/CLI-Simple/issues
    mailto: rlauer6@comcast.net
  repository:
    url: git://github.com/rlauer6/CLI-Simple.git
    web: http://github.com/rlauer6/CLI-Simple
    type: 'git'
